    body {
      background: linear-gradient(45deg, #000F1F, #002040, #001E3C, #003355);

      animation: darkBackgroundFlow 10s infinite alternate ease-in-out;
      color: white;
      font-family: 'Comic Neue', cursive, sans-serif;
      text-align: center;
      padding: 50px;
      overflow: hidden;
    }

    @keyframes darkBackgroundFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    button {
      background: linear-gradient(45deg, #002244, #003366);
      border: none;
      padding: 10px 30px;
      font-size: 1.5em;
      color: white;
      cursor: pointer;
      margin: 40px auto;
      display: block;
      border-radius: 40px;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    .quote {
      margin-top: 30px;
      font-size: 1.8em;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 6px rgba(255, 255, 255, 0.4);
      max-width: 70%;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.3;
    }

    .example {
      font-size: 1.2em;
      font-style: italic;
      color: #DDD;
      max-width: 70%;
      margin: 10px auto;
    }

    .bubble {
      position: absolute;
      bottom: -50px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: riseBubbles 6s ease-in-out forwards;
    }

    @keyframes riseBubbles {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-700px) scale(1.5); opacity: 0; }
    }

    @media screen and (max-width: 600px) {

      }
